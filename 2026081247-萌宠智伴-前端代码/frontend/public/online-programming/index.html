<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>在线编程练习</title><link rel="stylesheet" href="style.css"></head><body><div class="grade-bar" hidden style="display:none"><div><strong></strong></div></div><main class="embedded-main"><section class="course-header"><div><h1>用代码，理解神经网络。</h1></div><div class="progress-card"><div><span>本课学习进度</span><strong id="progress-label">0 / 4</strong></div><div class="progress-track"><div id="progress-bar"></div></div></div></section>
    <div class="task-tabs" role="tablist" aria-label="编程任务" id="task-tabs"></div>
    <section class="workspace">
      <article class="problem-panel"><div class="panel-heading"><span>任务说明</span></div><div class="problem-content" id="problem-content"></div></article>
      <section class="coding-panel" aria-label="编程工作区">
        <div class="editor-toolbar"><div><span class="status-dot"></span><strong>main.py</strong><span class="language">Python</span></div><button id="reset" class="text-button">↺ 重置代码</button></div>
        <div class="editor"><div class="line-numbers" aria-hidden="true" id="line-numbers"></div><textarea id="code" aria-label="代码编辑器" spellcheck="false" autocapitalize="off"></textarea></div>
        <div class="editor-footer"><span id="save-status">代码自动保存在当前浏览器</span><span>Tab 缩进 · Ctrl / ⌘ + Enter 运行</span></div>
        <div class="input-section"><label for="input">自定义输入 <span>通过 input 获取字符串</span></label><div class="input-row"><textarea id="input" rows="2" aria-label="自定义输入"></textarea><button class="run-button" id="run">▶ 运行代码</button></div></div>
        <div class="result-section"><div class="result-heading"><strong>运行结果</strong><span id="result-status">等待运行</span></div><pre id="output" aria-live="polite">点击「运行代码」，看看你的思路会得到什么结果。</pre><div id="test-result" aria-live="polite"></div></div>
        <div class="tutor-entry"><div class="tutor-entry-intro"><img class="tutor-avatar" src="/images/avatars/programming-teacher.png" alt="编程老师" /><div class="tutor-entry-text"><strong>编程老师</strong><p>先给提示，帮你顺着题目、代码和运行结果自己找到答案。</p></div></div><button id="open-tutor" class="secondary-button" aria-haspopup="dialog">问 AI ↗</button></div>
      </section>
    </section>
    <footer class="lesson-footer"><div><button id="previous" class="secondary-button">← 上一题</button><button id="next" class="secondary-button">下一题 →</button></div></footer>

</main><dialog id="tutor-dialog" aria-labelledby="tutor-title"><div class="tutor-header"><div class="tutor-header-intro"><img class="tutor-avatar" src="/images/avatars/programming-teacher.png" alt="编程老师" /><div><strong id="tutor-title">编程老师</strong><small>先给提示，帮助你自己找到答案</small></div></div><button id="close-tutor" class="text-button" aria-label="关闭学习助手">✕</button></div><div class="tutor-context" id="tutor-context"></div><div class="tutor-demo">提问时会附带当前题目、代码与运行结果</div><div id="tutor-messages" role="log" aria-label="提问记录" aria-live="polite"></div><div class="tutor-suggestions"><button type="button" data-question="这道题应该从哪里开始？">不知道怎么开始</button><button type="button" data-question="请解释一下本题的知识点">解释知识点</button><button type="button" data-question="帮我看看运行报错">看看报错</button><button type="button" data-question="再给我一步提示">下一步提示</button></div><form id="tutor-form"><label for="tutor-question">你卡在哪一步？</label><textarea id="tutor-question" maxlength="1500" rows="3" placeholder="例如：权重和偏置分别有什么作用？" required></textarea><div class="tutor-compose-footer"><small>Enter 发送 · Shift + Enter 换行</small><button type="submit" class="run-button">发送 ↑</button></div></form></dialog><script src="courses.js"></script><script src="python-runtime.js"></script><script src="app.js"></script><script src="tutor.js"></script></body></html>
